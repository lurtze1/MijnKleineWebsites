# Eén nginx voor alle sites. De repo staat in /usr/share/nginx/html:
#   /                -> startpagina (index.html)
#   /<site>/         -> de site in die map
#   /shared/         -> gedeelde stijl en account.js
#   /account/        -> inloggen en accountbeheer
#   /api/            -> doorgestuurd naar de api-container (accounts, versleutelde opslag)

# Achter de Cloudflare-tunnel staat het adres van de bezoeker in CF-Connecting-IP. Alleen gebruikt om
# te begrenzen (hieronder en in de API); het wordt nergens bewaard en er is geen access-log voor /api/.
map $http_cf_connecting_ip $bezoeker {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}
limit_req_zone $bezoeker zone=api:1m rate=10r/s;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    charset_types text/css text/plain application/javascript;
    include /etc/nginx/conf.d/kop.inc;

    # De webroot is de hele repo. Niet serveren: verborgen bestanden (.git, .env), deploy-spul en tests.
    location ~ /\.                         { return 404; }
    location ^~ /deploy/                   { return 404; }
    location ~ ^/(compose\.yaml|deploy\.ps1)$ { return 404; }
    location ~ \.test\.js$                 { return 404; }

    # De API. ^~ zodat dit vóór de regels hierboven en hieronder gaat: de broncode in de map api/ wordt
    # dus nooit als bestand geserveerd. De naam "api" wordt per verzoek opgezocht (resolver + variabele),
    # zodat nginx ook start als de api-container er even niet is.
    location ^~ /api/ {
        resolver 127.0.0.11 valid=10s;
        set $api http://api:3000;
        limit_req zone=api burst=40 nodelay;
        limit_req_status 429;
        client_max_body_size 64k;
        access_log off;
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $bezoeker;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 20s;
    }

    # De accountpagina mag alleen scripts van dit domein draaien en nergens anders mee praten.
    location ^~ /account/ {
        include /etc/nginx/conf.d/kop.inc;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; form-action 'self'; base-uri 'none'; frame-ancestors 'none'";
        try_files $uri $uri/ =404;
    }

    # Bronnen (docs/research/*.md) als leesbare tekst tonen in plaats van downloaden.
    location ~ \.md$ {
        types { }
        default_type text/plain;
        include /etc/nginx/conf.d/kop.inc;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
