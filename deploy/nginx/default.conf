# Eén nginx voor alle sites. De repo staat in /usr/share/nginx/html:
#   /                -> startpagina (index.html)
#   /<site>/         -> de site in die map
#   /shared/site.css -> gedeelde stijl
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    charset_types text/css text/plain application/javascript;

    # Altijd eerst bij de server navragen (ETag): een push is dan direct zichtbaar.
    add_header Cache-Control "no-cache";

    # De webroot is de hele repo. Niet serveren: verborgen bestanden (.git, .env), deploy-spul en tests.
    location ~ /\.                         { return 404; }
    location ^~ /deploy/                   { return 404; }
    location ~ ^/(compose\.yaml|deploy\.ps1)$ { return 404; }
    location ~ \.test\.js$                 { return 404; }

    # Bronnen (docs/research/*.md) als leesbare tekst tonen in plaats van downloaden.
    location ~ \.md$ {
        types { }
        default_type text/plain;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
