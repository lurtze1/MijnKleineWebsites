<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rekentrainer 3F</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: smalle vaste kolom in de stijl van een forum uit 2008 — topbalk, logo + tabs, groen zoekvak met de som, grijze kopbalken en tabellen met afwisselende rijen.
   Bewust één (lichte) look, zoals die sites toen waren. */
:root{
  color-scheme:light;
  --page:#ffffff; --ink:#222222; --muted:#666666;
  --link:#1f5fa8; --hover:#d26a00;
  --green:#5b9bd5; --green-dark:#2f6ea8; --green-bg:#ddeefd; --green-line:#a9cdef; --green-top:#eef6fe;
  --grey-bg:#f4f4f4; --grey-line:#c9c9c9;
  --font:Verdana, Tahoma, "DejaVu Sans", Arial, sans-serif;
}
[data-dom="getallen"]{--green:#5b9bd5;--green-dark:#2f6ea8;--green-bg:#ddeefd;--green-line:#a9cdef;--green-top:#eef6fe}
[data-dom="verh"]{--green:#e8916b;--green-dark:#a9532f;--green-bg:#ffe5d8;--green-line:#f2bfa6;--green-top:#fff3ed}
[data-dom="meten"]{--green:#5fb98c;--green-dark:#2a7550;--green-bg:#d8f2e5;--green-line:#a6dcc0;--green-top:#eefaf3}
[data-dom="verbanden"]{--green:#9a80dd;--green-dark:#5f46a6;--green-bg:#ebe4fc;--green-line:#c9b9f2;--green-top:#f6f2fe}
[data-dom="mix"]{--green:#d4ad2a;--green-dark:#7d630f;--green-bg:#fff2c2;--green-line:#ead68a;--green-top:#fffae6}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--page);color:var(--ink);font:13px/1.55 var(--font);
  padding-left:max(12px, env(safe-area-inset-left, 0px));padding-right:max(12px, env(safe-area-inset-right, 0px));padding-block:10px 40px}
.page{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
a,.lnk{color:var(--link);text-decoration:underline;cursor:pointer}
a:hover,.lnk:hover{color:var(--hover)}

/* topbalk */
.topbar{background:linear-gradient(#fafafa,#dedede);border:1px solid var(--grey-line);text-align:center;font-size:11px;padding:3px 8px;color:#888}
.topbar span{color:var(--link)}

/* kop */
.head{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:flex-start;justify-content:space-between;border-bottom:1px solid #e3e3e3;padding-bottom:6px}
.logo{display:flex;gap:10px;align-items:center}
.blocks{display:grid;grid-template-columns:repeat(2,26px);gap:3px;transform:rotate(-8deg)}
.blocks span{display:grid;place-items:center;height:26px;font:bold 15px var(--font);color:#fff;border:1px solid rgba(0,0,0,.25);border-radius:3px;
  background:linear-gradient(#c6e1fa,#7fb3e3);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),1px 2px 0 #bbb;text-shadow:0 1px 0 rgba(0,0,0,.3)}
.blocks span:nth-child(2){background:linear-gradient(#ffd6c2,#eb9a76)}
.blocks span:nth-child(3){background:linear-gradient(#c3ecd6,#6cc095)}
.blocks span:nth-child(4){background:linear-gradient(#dcd1fa,#a58ce2)}
.wordmark{font:bold 21px/1 var(--font);letter-spacing:-.5px;color:#333}
.wordmark sup{font-size:11px;color:var(--green-dark);letter-spacing:0;margin-left:2px}
.count{font-size:11px;color:var(--muted);margin-top:4px}
.score{font-size:11px;color:#333;text-align:right;font-variant-numeric:tabular-nums}
.score b{color:var(--link)}

/* tabs */
.topics{display:flex;flex-wrap:wrap;gap:4px 22px;padding:4px 2px 0;width:100%}
.topics button{position:relative;background:none;border:0;padding:2px 0 10px;font:bold 13px var(--font);color:var(--link);text-decoration:underline;cursor:pointer}
.topics button:hover{color:var(--hover)}
.topics button[aria-pressed="true"]{color:var(--green-dark);text-decoration:none}
.topics button[aria-pressed="true"]::after{content:"";position:absolute;left:50%;bottom:0;transform:translateX(-50%);border:7px solid transparent;border-top-color:var(--green);border-bottom:0}
.topics button:focus-visible,.lnk:focus-visible,.classic:focus-visible{outline:2px dotted var(--link);outline-offset:2px}

/* groen vak met de som */
.sheet{background:linear-gradient(var(--green-top),var(--green-bg));border:1px solid var(--green-line);padding:12px 14px;display:grid;grid-template-columns:58px 1fr;gap:10px 14px;align-items:start}
.badge-ic{width:54px;height:54px;border-radius:50%;border:2px solid var(--green);background:radial-gradient(circle at 40% 35%,#ffffff,var(--green-bg));display:grid;place-items:center;font:bold 24px var(--font);color:var(--green-dark);grid-row:span 5}
.sheet > *:not(.badge-ic){grid-column:2;min-width:0}
.filter{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:12px;font-weight:bold;color:#333}
.filter select{font:12px var(--font);color:#222;border:1px solid #7f9db9;background:linear-gradient(#ffffff,#ececec);padding:3px 4px;max-width:100%;cursor:pointer}
.filter select:focus-visible{outline:2px dotted var(--link);outline-offset:2px}
.tag{justify-self:start;display:inline-flex;align-items:stretch;font:bold 9px/1 var(--font);text-transform:uppercase;letter-spacing:.8px;border:1px solid #222}
.tag::before{content:"★★";background:#3a3a3a;color:#ffd84a;padding:3px 5px}
.tag span{background:linear-gradient(90deg,#4a4a4a,var(--green));color:#fff;padding:3px 8px}
.q{margin:0;font-size:15px;line-height:1.6;color:#111}
.q .num{font-weight:bold;white-space:nowrap;color:#000}
.show:empty{display:none}
.show{background:#fff;border:1px solid var(--green-line);padding:8px}
.answer{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.field{display:flex;align-items:center;gap:6px;background:#fff;border:2px solid #3b7bd1;padding:0 6px;flex:0 1 300px;min-width:0}
.field input{font:bold 15px var(--font);border:0;outline:0;background:transparent;color:#000;padding:4px 0;width:100%;min-width:0}
.field span{color:var(--muted);font-size:12px;white-space:nowrap}
.classic{font:bold 12px var(--font);color:#222;cursor:pointer;background:linear-gradient(#fdfdfd,#d2d2d2);border:1px solid #6f6f6f;border-radius:2px;padding:5px 12px;box-shadow:inset 0 1px 0 #fff}
.classic:hover{background:linear-gradient(#ffffff,#e2e2e2)}
.classic:active{background:linear-gradient(#d2d2d2,#f4f4f4)}
.hint{font-size:11px;color:var(--muted)}

/* infobalk */
.info{background:var(--grey-bg);border:1px solid #dedede;padding:8px 12px;display:flex;flex-direction:column;gap:8px;font-size:12px}
.actions{display:flex;flex-wrap:wrap;gap:4px 18px}
.actions .lnk{background:none;border:0;padding:0;font:12px var(--font)}
.actions .lnk::before{content:"» ";color:var(--green);font-weight:bold;text-decoration:none;display:inline-block;margin-right:3px}
.fb{border:1px solid;padding:6px 10px;font-weight:bold;display:flex;gap:8px;align-items:baseline}
.fb::before{flex:none;display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;color:#fff;font-size:10px;line-height:1}
.fb.ok{background:#d8f2e5;border-color:#8fd0ae;color:#24684a}
.fb.ok::before{content:"✔";background:#4fae80}
.fb.no{background:#fde3e6;border-color:#eba7b0;color:#a3303f}
.fb.no::before{content:"✘";background:#d9606f}
.fb span{font-weight:normal;color:var(--ink)}

/* kopbalk-tabellen */
.box{border:1px solid var(--grey-line)}
.box h3,.crib h2{margin:0;background:linear-gradient(#ececec,#cfcfcf);border-bottom:1px solid #bdbdbd;font:bold 11px var(--font);text-align:center;padding:5px;color:#333}
.uitleg ol{list-style:none;margin:0;padding:0;counter-reset:s}
.uitleg li{counter-increment:s;display:grid;grid-template-columns:42px 1fr;border-bottom:1px solid #fff;min-width:0}
.uitleg li::before{content:counter(s);display:grid;place-items:center;color:var(--link);font-weight:bold;text-decoration:underline;border-right:1px solid #fff}
.uitleg li > *{min-width:0}
.uitleg li:nth-child(odd){background:var(--green-bg)}
.uitleg li:nth-child(even){background:#f3f3f3}
.uitleg li{padding:0}
.uitleg li{align-items:center}
.uitleg ol li{padding-block:6px;padding-right:10px}
#extra:not(:empty){padding:10px;border-top:1px solid var(--grey-line)}

.scroll{overflow-x:auto}
.ladder{display:grid;grid-template-columns:repeat(7,minmax(42px,1fr));gap:2px;min-width:320px}
.cell{text-align:center;font:bold 11px var(--font);padding:6px 2px;background:#f6f6f6;border:1px solid #d3d3d3;color:#777}
.cell.path{background:var(--green-bg);color:#333;border-color:var(--green-line)}
.cell.from{background:#fff;border:2px solid var(--green);color:var(--green-dark)}
.cell.to{background:var(--green);border-color:var(--green-dark);color:#fff}
.note{font-size:11px;color:var(--muted);margin-top:5px}

table.vt{border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums;background:#fff}
table.vt th,table.vt td{border:1px solid var(--grey-line);padding:4px 12px;text-align:center}
table.vt tr:first-child th,table.vt tr:first-child td{background:linear-gradient(#f2f2f2,#dadada);font-weight:bold}
table.vt th{text-align:left;color:#333;background:#f4f4f4}
table.vt td.ans{background:var(--green)!important;color:#fff;font-weight:bold}

.chart svg{width:100%;max-width:440px;height:auto;display:block}
.gl{stroke:#dcdcdc;stroke-width:1}
.tl{fill:#555;font:10px var(--font)}
.bar{fill:var(--green);stroke:var(--green-dark);stroke-width:1}

/* spiekbriefje */
.crib{border:1px solid var(--grey-line)}
.crib .share{margin:0;padding:6px 10px;font-size:11px;color:var(--muted);background:#fafafa;border-bottom:1px solid #e3e3e3}
.crib .rule{margin:0;padding:8px 10px 4px;font-weight:bold;color:var(--green-dark)}
.crib > .scroll,.crib > .note{margin-inline:10px}
.crib ul{list-style:none;margin:0 !important;padding:0}
.crib > .note + ul{border-top:1px solid #e3e3e3;margin-top:8px !important}
.crib li{padding:5px 10px 5px 26px;position:relative;border-top:1px solid #fff}
.crib li::before{content:"»";position:absolute;left:11px;color:var(--green);font-weight:bold}
.crib li:nth-child(odd){background:var(--green-bg)}
.crib li:nth-child(even){background:#f6f6f6}
code{font:bold 12px var(--font);background:#fffbe0;border:1px solid #e6d77a;padding:0 4px;white-space:nowrap}

footer{font-size:11px;color:#888;text-align:center;border-top:1px solid #e3e3e3;padding-top:8px}
@media (max-width:520px){
  .sheet{grid-template-columns:1fr}
  .badge-ic{display:none}
  .sheet > *:not(.badge-ic){grid-column:1}
  .score{text-align:left}
}
</style>

<div class="page" id="app" data-dom="getallen">
  <div class="topbar"><span>Rekentrainer 3F</span> | <span>Onbeperkt oefenen</span> | <span>Uitleg bij elke som</span></div>

  <div class="head">
    <div class="logo">
      <div class="blocks" aria-hidden="true"><span>+</span><span>−</span><span>×</span><span>÷</span></div>
      <div>
        <div class="wordmark">rekentrainer<sup>3F</sup></div>
        <div class="count">oefen in 4 domeinen · elke som is nieuw</div>
      </div>
    </div>
    <div class="score" aria-live="polite">Resultaten: goed in 1x <b id="sGood">0</b> van <b id="sTot">0</b><br>Reeks: <b id="sStreak">0</b> op rij</div>
    <nav class="topics" id="topics" aria-label="Domein">
      <button data-t="getallen" aria-pressed="true">Getallen</button>
      <button data-t="verh" aria-pressed="false">Verhoudingen</button>
      <button data-t="meten" aria-pressed="false">Meten &amp; meetkunde</button>
      <button data-t="verbanden" aria-pressed="false">Verbanden</button>
      <button data-t="mix" aria-pressed="false">Alles door elkaar</button>
    </nav>
  </div>

  <section class="sheet" aria-live="polite">
    <div class="badge-ic" aria-hidden="true">÷</div>
    <div class="filter"><label for="cat">Onderwerp:</label><select id="cat"></select></div>
    <span class="tag"><span id="tag"></span></span>
    <p class="q" id="question"></p>
    <div class="show" id="show"></div>
    <form class="answer" id="form" autocomplete="off">
      <label class="field" for="ans">
        <span id="pre" hidden></span>
        <input id="ans" inputmode="decimal" placeholder="Jouw antwoord..." aria-label="Jouw antwoord">
        <span id="unit"></span>
      </label>
      <button class="classic" id="check" type="submit">Controleer</button>
    </form>
  </section>

  <div class="info">
    <div class="fb" id="fb" hidden></div>
    <div class="actions">
      <button class="lnk" id="showUitleg" type="button">Laat uitleg zien</button>
      <button class="lnk" id="next" type="button">Nieuwe som</button>
    </div>
  </div>

  <div class="box uitleg" id="uitleg" hidden>
    <h3>Zo los je het op</h3>
    <ol id="steps"></ol>
    <div id="extra"></div>
  </div>

  <section class="crib" id="crib"></section>
  <footer>Typ kommagetallen met een komma of punt · eenheden mag je weglaten · min-getallen met een −</footer>
</div>

<script>
const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[R(0,a.length-1)];
const clean=x=>Number((+x).toPrecision(12));
const fmt=x=>clean(x).toLocaleString('nl-NL',{maximumFractionDigits:6});
const eur=c=>'€ '+(c/100).toLocaleString('nl-NL',{minimumFractionDigits:2,maximumFractionDigits:2});
const N=x=>`<span class="num">${x}</span>`;
const gcd=(a,b)=>b?gcd(b,a%b):a;
const okDec=(x,d)=>Math.abs(x*10**d-Math.round(x*10**d))<1e-7;
const pad=n=>String(n).padStart(2,'0');
const tijd=m=>`${pad(Math.floor(m/60)%24)}:${pad(m%60)}`;

/* ---------- hulpmiddelen ---------- */
const L={
  lengte:{u:['km','hm','dam','m','dm','cm','mm'],f:10,naam:'lengte',kp:1,lo:0,hi:6,max:3},
  opp:{u:['km²','hm²','dam²','m²','dm²','cm²','mm²'],f:100,naam:'oppervlakte',kp:2,lo:2,hi:5,max:2,sup:'²'},
  inh:{u:['km³','hm³','dam³','m³','dm³','cm³','mm³'],f:1000,naam:'inhoud',kp:3,lo:3,hi:5,max:2,sup:'³'},
  liter:{u:['kl','hl','dal','l','dl','cl','ml'],f:10,naam:'liters',kp:1,lo:0,hi:6,max:3},
  gewicht:{u:['kg','hg','dag','g','dg','cg','mg'],f:10,naam:'gewicht',kp:1,lo:0,hi:6,max:3},
};
function ladder(lad,i,j){
  const lo=Math.min(i,j),hi=Math.max(i,j),n=hi-lo,op=j>i?'×':':';
  const cells=lad.u.map((u,x)=>`<span class="cell${x===i?' from':''}${x===j?' to':''}${x>lo&&x<hi?' path':''}">${u}</span>`).join('');
  return `<div class="scroll"><div class="ladder">${cells}</div></div><div class="note">${lad.u[i]} → ${lad.u[j]}: ${n} ${n===1?'stap':'stappen'} naar ${j>i?'rechts':'links'} = ${Array(n).fill(op+' '+fmt(lad.f)).join('  ')}</div>`;
}
function vtab(rows,ansPos){
  return `<div class="scroll"><table class="vt">${rows.map((r,ri)=>`<tr><th>${r[0]}</th>${r.slice(1).map((c,ci)=>`<td${ansPos&&ansPos[0]===ri&&ansPos[1]===ci?' class="ans"':''}>${c}</td>`).join('')}</tr>`).join('')}</table></div>`;
}
function pct(n,p){
  const v=clean(n*p/100),t=clean(n/10);let s;
  if(p===50)s=[`50% is de helft: ${fmt(n)} : 2 = ${fmt(v)}`];
  else if(p===25)s=[`25% is een kwart: ${fmt(n)} : 4 = ${fmt(v)}`];
  else if(p===75)s=[`25% = ${fmt(n)} : 4 = ${fmt(n/4)}`,`75% = 3 × 25% = ${fmt(v)}`];
  else if(p===1)s=[`1% = ${fmt(n)} : 100 = ${fmt(v)}`];
  else if(p%10===0)s=[`10% = ${fmt(n)} : 10 = ${fmt(t)}`].concat(p===10?[]:[`${p}% = ${p/10} × 10% = ${fmt(v)}`]);
  else if(p===5)s=[`10% = ${fmt(n)} : 10 = ${fmt(t)}`,`5% = de helft van 10% = ${fmt(v)}`];
  else if(p%10===5)s=[`10% = ${fmt(n)} : 10 = ${fmt(t)}`,`5% = de helft van 10% = ${fmt(t/2)}`,`${p}% = ${(p-5)/10} × 10% + 5% = ${fmt(clean(t*(p-5)/10))} + ${fmt(t/2)} = ${fmt(v)}`];
  else s=[`1% = ${fmt(n)} : 100 = ${fmt(n/100)}`,`${p}% = ${p} × 1% = ${fmt(v)}`];
  return {v,s};
}
function bars(labels,vals,step){
  const W=360,H=220,l=40,b=26,t=10,r=6,max=Math.ceil(Math.max(...vals)/step)*step,ph=H-b-t,pw=W-l-r,bw=pw/labels.length;
  let g='';
  for(let y=0;y<=max;y+=step){const yy=t+ph-(y/max)*ph;g+=`<line class="gl" x1="${l}" x2="${W-r}" y1="${yy}" y2="${yy}"/><text class="tl" x="${l-6}" y="${yy+4}" text-anchor="end">${fmt(y)}</text>`;}
  labels.forEach((lb,i)=>{const h=vals[i]/max*ph,x=l+i*bw+bw*.2;g+=`<rect class="bar" x="${x}" y="${t+ph-h}" width="${bw*.6}" height="${h}" rx="3"/><text class="tl" x="${x+bw*.3}" y="${H-8}" text-anchor="middle">${lb}</text>`;});
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Staafdiagram">${g}</svg></div>`;
}

/* ================= GETALLEN ================= */
const GETALLEN=[
 function splitsen(){
  const a=R(3,9),base=R(2,9)*10,d=pick([-2,-1,1,2]),b=base+d,ans=a*b;
  return {type:'Hoofdrekenen · splitsen',text:`Reken uit zonder rekenmachine: ${N(a+' × '+b)}`,answer:ans,
   steps:[`${b} ligt dicht bij ${base}. Reken eerst ${a} × ${base} = ${fmt(a*base)}.`,
    `${b} is ${Math.abs(d)} ${d<0?'minder':'meer'} dan ${base}, dus ${d<0?'haal':'tel'} ${a} × ${Math.abs(d)} = ${a*Math.abs(d)} ${d<0?'eraf':'erbij'}.`,
    `${fmt(a*base)} ${d<0?'−':'+'} ${a*Math.abs(d)} = <b>${fmt(ans)}</b>`]};
 },
 function keer25(){
  const n=R(6,48),ans=n*25;
  return {type:'Hoofdrekenen · handig keer',text:`Reken uit: ${N(n+' × 25')}`,answer:ans,
   steps:[`25 is een kwart van 100. Dus × 25 = × 100 en dan : 4.`,`${n} × 100 = ${fmt(n*100)}.`,`${fmt(n*100)} : 2 = ${fmt(n*50)}, nog eens : 2 = <b>${fmt(ans)}</b>`]};
 },
 function keer5(){
  const n=R(13,98),ans=n*5;
  return {type:'Hoofdrekenen · handig keer',text:`Reken uit: ${N(n+' × 5')}`,answer:ans,
   steps:[`5 is de helft van 10. Dus × 5 = × 10 en dan halveren.`,`${n} × 10 = ${n*10}.`,`${n*10} : 2 = <b>${fmt(ans)}</b>`]};
 },
 function delen(){
  const b=pick([4,5,6,7,8,12,15,25]),q=R(12,40),a=b*q;let steps;
  if(b===4) steps=[`: 4 = twee keer halveren.`,`${a} : 2 = ${a/2}, en ${a/2} : 2 = <b>${q}</b>`];
  else if(b===8) steps=[`: 8 = drie keer halveren.`,`${a} → ${a/2} → ${a/4} → <b>${q}</b>`];
  else if(b===5) steps=[`: 5 = eerst × 2, dan : 10.`,`${a} × 2 = ${a*2}, en ${a*2} : 10 = <b>${q}</b>`];
  else if(b===25) steps=[`: 25 = eerst × 4, dan : 100.`,`${a} × 4 = ${fmt(a*4)}, en ${fmt(a*4)} : 100 = <b>${q}</b>`];
  else {const t=Math.floor(q/10)*10,r=q-t;
    steps=[`Begin met een rond getal: ${b} × ${t} = ${b*t}.`,`Over: ${a} − ${b*t} = ${a-b*t}. En ${b} × ${r} = ${b*r}.`,`Samen ${t} + ${r} = <b>${q}</b>`];}
  return {type:'Hoofdrekenen · delen',text:`Reken uit: ${N(fmt(a)+' : '+b)}`,answer:q,steps};
 },
 function delenKomma(){
  const b=pick([0.5,0.25,0.2,0.1,0.05,0.12,0.4,0.02]),q=pick([R(3,40)*10,R(4,60)]),a=clean(q*b),m=b<0.1||b===0.12||b===0.25?100:10;
  return {type:'Delen door een kommagetal',text:`Reken uit: ${N(fmt(a)+' : '+fmt(b))}`,answer:q,
   steps:[`Een kommagetal als deler is lastig. Maak er een heel getal van: doe <b>beide</b> getallen × ${m}.`,`${fmt(a)} × ${m} = ${fmt(a*m)} en ${fmt(b)} × ${m} = ${fmt(b*m)}.`,`${fmt(a*m)} : ${fmt(b*m)} = <b>${fmt(q)}</b>`,`Controle: delen door iets kleiners dan 1 geeft een <b>groter</b> getal.`]};
 },
 function kommakeer(){
  const k=pick([0.5,0.25,1.5,2.5]),n=pick([R(6,40)*2,R(3,25)*4]),ans=n*k;
  const s={0.5:[`0,5 is de helft.`,`${n} : 2 = <b>${fmt(ans)}</b>`],0.25:[`0,25 is een kwart.`,`${n} : 4 = <b>${fmt(ans)}</b>`],

const VERBANDEN=[
 function taxi(){

  return {type:'Formule invullen',text:`Een taxi rekent met de formule ${N('kosten = '+eur(st).replace('€ ','')+' + '+eur(pk).replace('€ ','')+' × aantal km')}. Wat kost een rit van ${N(km+' km')}?`,answer:c/100,pre:'€',
   steps:[`Vul in: kosten = ${eur(st)} + ${eur(pk)} × ${km}.`,`Eerst keer (× gaat vóór +): ${eur(pk)} × ${km} = ${eur(pk*km)}.`,`Dan plus: ${eur(st)} + ${eur(pk*km)} = <b>${eur(c)}</b>`]};
 },
 function fahrenheit(){
  const c=pick([10,20,25,30,35,0,15,-10,5,40]),f=clean(c*1.8+32);

   steps:[`Vul in: ${fmt(c).replace('-','−')} × 1,8 + 32.`,`Eerst keer: ${fmt(c).replace('-','−')} × 1,8 = ${fmt(clean(c*1.8)).replace('-','−')}.`,`Dan + 32: <b>${fmt(f).replace('-','−')} °F</b>`]};
 },
 function onweer(){

   steps:[`Vul in: ${s} : 3.`,`${s} : 3 = <b>${ans} km</b>`,`Een vuistregel geeft een schatting, geen exact antwoord.`]};
 },
 function verzendTabel(){
  const T=[[2,495],[5,695],[10,895],[23,1395]],cost=w=>T.find(r=>w<=r[0])[1];

   steps:[`"t/m" = tot en met. Precies 5 kg valt dus nog in het vak "5 kg".`,`${fmt(w1)} kg → ${eur(cost(w1))}. ${fmt(w2)} kg → ${eur(cost(w2))}.`,`Samen: <b>${eur(c)}</b>`]};
 },
 function grafiek(){

/* ---------- state ---------- */
let topic='getallen',cat='alle',cur=null,tries=0,solved=false,good=0,tot=0,streak=0;
const $=id=>document.getElementById(id);
function parse(s){
  s=s.trim().toLowerCase().replace(/[−–]/g,'-').replace(/[€\s]/g,'').replace(/[a-z³²°%]+$/,'');
  if(!s) return NaN;
  if(/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(s)) s=s.replace(/\./g,'').replace(',','.');
  else s=s.replace(',','.');
  return Number(s);
}
function newQ(){
  let d,pool;
  if(cat!=='alle'){const [cd,cn]=cat.split('|');d=cd;pool=GEN[cd].filter(f=>CAT[f.name]===cn);}
  else{d=topic==='mix'?pick(['getallen','getallen','verh','verh','meten','verbanden']):topic;pool=GEN[d];}
  cur=pick(pool)();cur.dom=d;tries=0;solved=false;
  $('tag').textContent=cur.type;
  $('question').innerHTML=cur.text;
  $('show').innerHTML=cur.show||'';
  $('unit').textContent=cur.unit||'';
  $('pre').textContent=cur.pre||'';$('pre').hidden=!cur.pre;
  $('ans').value='';$('fb').hidden=true;$('uitleg').hidden=true;
  $('showUitleg').textContent='Laat uitleg zien';
  $('steps').innerHTML=cur.steps.map(s=>`<li>${s}</li>`).join('');
  $('extra').innerHTML=cur.extra||'';
  $('check').textContent='Controleer';
}
function answerText(){
  const a=cur.pre==='€'?(Math.round(cur.answer*100)/100).toLocaleString('nl-NL',{minimumFractionDigits:2,maximumFractionDigits:2}):fmt(cur.answer).replace('-','−');
  return (cur.pre?cur.pre+' ':'')+a+(cur.unit?' '+cur.unit:'');
}
$('form').addEventListener('submit',e=>{
  e.preventDefault();
  if(solved){newQ();$('ans').focus();return;}
  const v=parse($('ans').value),fb=$('fb');
  if(isNaN(v)){fb.hidden=false;fb.className='fb no';fb.innerHTML='Typ eerst een getal. <span>Bijvoorbeeld 2,5 of 160.</span>';return;}
  tries++;
  const tol=cur.tol||1e-9,ok=Math.abs(v-cur.answer)<=Math.max(1e-9,Math.abs(cur.answer)*tol);
  fb.hidden=false;
  if(tries===1)tot++;
  if(ok){solved=true;if(tries===1){good++;streak++;}else streak=0;
    fb.className='fb ok';fb.innerHTML=`Goed! <span>Het antwoord is ${answerText()}. Druk op Enter voor een nieuwe som.</span>`;
    $('check').textContent='Volgende som';
  }else{streak=0;fb.className='fb no';
    fb.innerHTML=tries<2?`Nog niet goed. <span>Probeer het nog eens, of bekijk de uitleg.</span>`:`Nog niet goed. <span>Het juiste antwoord is ${answerText()}. Lees de uitleg hieronder.</span>`;
    if(tries>=2){$('uitleg').hidden=false;$('showUitleg').textContent='Verberg uitleg';}}
  $('sGood').textContent=good;$('sTot').textContent=tot;$('sStreak').textContent=streak;
});
$('next').addEventListener('click',()=>{newQ();$('ans').focus();});
$('showUitleg').addEventListener('click',()=>{const u=$('uitleg');u.hidden=!u.hidden;$('showUitleg').textContent=u.hidden?'Laat uitleg zien':'Verberg uitleg';});
$('topics').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  topic=b.dataset.t;$('app').dataset.dom=topic;
  document.querySelectorAll('#topics button').forEach(x=>x.setAttribute('aria-pressed',x===b));
  cat='alle';buildCats();$('crib').innerHTML=CRIB[topic];newQ();
});
$('cat').addEventListener('change',e=>{cat=e.target.value;newQ();});
buildCats();$('crib').innerHTML=CRIB[topic];
newQ();
</script>
